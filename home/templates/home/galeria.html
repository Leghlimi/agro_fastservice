{% extends 'base.html' %}
{% load static %}

{% block title %}Galería — Agro FastService{% endblock %}

{% block content %}

    <!-- Hero galería -->
    <div class="py-4 mb-4"
         style="background: linear-gradient(135deg, #1a3a1a 0%, #214d21 60%, #4a9e4a 100%); border-radius: 0 0 1rem 1rem;">
        <div class="container text-center text-white py-3">
            <h1 class="fw-bold mb-2"><i class="fas fa-tractor me-2"></i>Nuestra maquinaria</h1>
            <p class="text-white-50 mb-0">Equipos especializados para la cosecha de sandías en Almería</p>
        </div>
    </div>

    <div class="container py-4">
        <div class="row mb-4">
            <div class="col-12">
                <div class="card border-0 shadow-sm overflow-hidden galeria-card">
                    <img src="{% static 'img/info.jpeg' %}"
                         class="img-fluid w-100 galeria-img"
                         alt="Agro FastService"
                         style="max-height: 500px; object-fit: contain;">
                </div>
            </div>
        </div>
        <div class="row row-cols-1 row-cols-sm-2 g-4">
            {% for i in "12345678" %}
                <div class="col">
                    <div class="card border-0 shadow-sm overflow-hidden galeria-card">
                        <div class="overflow-hidden" style="height: 260px;">
                            <img src="{% static 'img/afs' %}{{ forloop.counter }}.jpeg"
                                 class="img-fluid w-100 h-100 galeria-img"
                                 alt="Maquinaria AFS {{ forloop.counter }}"
                                 style="object-fit: contain;">
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>

        <div class="text-center mt-5">
            <a href="{% url 'home' %}" class="btn btn-success rounded-pill px-4">
                <i class="fas fa-arrow-left me-2"></i>Volver al inicio
            </a>
        </div>
    </div>

{% endblock %}
